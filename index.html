<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Vườn Hoa Hồng - Chúc Mừng 20/10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #0b020f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Giao diện nút và thiệp */
        .ui-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* Khối tiêu đề trang đầu */
        .hero-banner {
            position: absolute;
            top: 10%;
            text-align: center;
            pointer-events: auto;
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 5;
            padding: 0 20px;
        }

        .hero-banner.hidden {
            opacity: 0;
            transform: translateY(-30px);
            pointer-events: none;
        }

        .hero-banner h2 {
            color: #ffb7c5;
            font-size: 2.8rem;
            font-family: 'Georgia', serif;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.9);
        }

        .hero-banner p {
            color: #fce4ec;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .card {
            background: rgba(30, 10, 25, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 150, 180, 0.4);
            border-radius: 28px;
            padding: 35px 40px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 105, 180, 0.3);
            pointer-events: auto;
            transform: scale(0.8);
            opacity: 0;
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card.active {
            transform: scale(1);
            opacity: 1;
        }

        h1 {
            color: #ffb7c5;
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
            font-family: 'Georgia', serif;
        }

        .wish-content {
            color: #fce4ec;
            font-size: 1.1rem;
            line-height: 1.9;
            margin-bottom: 25px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, #ff4081, #c2185b);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.6);
            transition: transform 0.3s, box-shadow 0.3s;
            pointer-events: auto;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 30px rgba(255, 64, 129, 0.9);
        }

        #start-btn {
            position: absolute;
            bottom: 50px;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="ui-container">
        <!-- Banner trang đầu -->
        <div id="hero-banner" class="hero-banner">
            <h2>Khu Vườn Hồng 20/10 🌹</h2>
            <p>Nơi gửi gắm những lời chúc tốt đẹp nhất dành riêng cho chị</p>
        </div>

        <button id="start-btn" class="btn" onclick="startJourney()">🌹 Mời Chị Tiến Vào Khu Vườn</button>

        <!-- Thiệp lời chúc -->
        <div id="wish-card" class="card">
            <h1>Chúc Mừng Ngày 20/10 ✨</h1>
            <div class="wish-content">
                <p>Nhân ngày 20/10, chúc chị luôn tràn đầy năng lượng, tự tin và gặt hái thêm nhiều thành công mới trong công việc cũng như cuộc sống. Mong mọi điều suôn sẻ và tốt đẹp nhất sẽ luôn đến với chị!</p>
            </div>
            <button class="btn" onclick="restartJourney()">Dạo Vườn Lần Nữa</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let progress = 0; 
        let isMoving = false;

        const petals = [];
        const butterflies = [];
        const birds = [];
        const fireflies = [];

        // Cánh hoa rơi
        for (let i = 0; i < 90; i++) {
            petals.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 7 + 4,
                speedY: Math.random() * 1.5 + 0.6,
                speedX: Math.random() * 1.2 - 0.6,
                angle: Math.random() * Math.PI * 2,
                spin: (Math.random() - 0.5) * 0.04
            });
        }

        // Đom đóm lấp lánh
        for (let i = 0; i < 45; i++) {
            fireflies.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2.5 + 1,
                speedY: (Math.random() - 0.5) * 0.6,
                speedX: (Math.random() - 0.5) * 0.6
            });
        }

        // Bướm
        for (let i = 0; i < 7; i++) {
            butterflies.push({
                x: Math.random() * width,
                y: Math.random() * height * 0.6,
                size: Math.random() * 9 + 9,
                vx: (Math.random() - 0.5) * 1.8,
                vy: (Math.random() - 0.5) * 1.2,
                wingAngle: 0,
                wingSpeed: 0.18 + Math.random() * 0.1,
                color: ['#ff80ab', '#ff4081', '#ffc107', '#e040fb'][Math.floor(Math.random() * 4)]
            });
        }

        // Chim
        for (let i = 0; i < 5; i++) {
            birds.push({
                x: -100 - Math.random() * 200,
                y: 40 + Math.random() * 150,
                size: 16 + Math.random() * 10,
                vx: 1.8 + Math.random() * 1.2,
                wing: Math.random() * 10
            });
        }

        // --- HÀM VẼ HOA HỒNG CHI TIẾT ---
        function drawCompleteRose(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            ctx.strokeStyle = '#1b4d2e';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-15, 35, -8, 75);
            ctx.stroke();

            ctx.fillStyle = '#2e7d32';
            ctx.beginPath();
            ctx.ellipse(-14, 40, 13, 6, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.ellipse(10, 55, 12, 5, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            const petalLayers = [
                { count: 8, rX: 20, rY: 12, color: '#880e4f' },
                { count: 7, rX: 16, rY: 10, color: '#ad1457' },
                { count: 6, rX: 12, rY: 8,  color: '#c2185b' },
                { count: 5, rX: 8,  rY: 6,  color: '#e91e63' },
                { count: 4, rX: 5,  rY: 4,  color: '#ff4081' }
            ];

            petalLayers.forEach((layer, lIdx) => {
                ctx.fillStyle = layer.color;
                for (let i = 0; i < layer.count; i++) {
                    const angle = (i / layer.count) * Math.PI * 2 + (lIdx * 0.4);
                    const px = Math.cos(angle) * 4;
                    const py = Math.sin(angle) * 4;

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(angle);

                    ctx.beginPath();
                    ctx.ellipse(0, layer.rY * 0.6, layer.rX, layer.rY, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.lineWidth = 0.6;
                    ctx.stroke();

                    ctx.restore();
                }
            });

            ctx.fillStyle = '#510522';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // --- HÀM VẼ CỔNG HOA HỒNG & MẶT TRĂNG ĐỂ LẤP ĐẦY KHOẢNG TRỐNG ---
        function drawRoseArch(centerX, centerY, archWidth, archHeight) {
            ctx.save();
            
            // 1. Mặt trăng huyền ảo phía sau cổng
            const moonRadius = archWidth * 0.55;
            const moonGlow = ctx.createRadialGradient(centerX, centerY - 20, 10, centerX, centerY - 20, moonRadius * 1.8);
            moonGlow.addColorStop(0, 'rgba(255, 230, 245, 0.95)');
            moonGlow.addColorStop(0.3, 'rgba(255, 105, 180, 0.4)');
            moonGlow.addColorStop(1, 'transparent');

            ctx.fillStyle = moonGlow;
            ctx.beginPath();
            ctx.arc(centerX, centerY - 20, moonRadius * 1.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff0f5';
            ctx.beginPath();
            ctx.arc(centerX, centerY - 20, moonRadius * 0.5, 0, Math.PI * 2);
            ctx.fill();

            // 2. Mái vòm cổng
            ctx.strokeStyle = '#3a1e32';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.arc(centerX, centerY, archWidth / 2, Math.PI, 0);
            ctx.stroke();

            ctx.strokeStyle = '#ff80ab';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 3. Kết các bông hoa hồng lên khắp vòm cổng
            const numArchRoses = 11;
            for (let i = 0; i < numArchRoses; i++) {
                const angle = Math.PI + (i / (numArchRoses - 1)) * Math.PI;
                const rx = centerX + Math.cos(angle) * (archWidth / 2);
                const ry = centerY + Math.sin(angle) * (archWidth / 2);

                drawCompleteRose(rx, ry, 0.5 + Math.sin(i) * 0.1);
            }

            ctx.restore();
        }

        // Vẽ con đường
        function drawPath() {
            ctx.save();
            
            const startW = width * 0.55;
            const endW = width * 0.12 + (progress * width * 0.15);
            
            const startY = height;
            const endY = height * 0.42 + (progress * height * 0.12);

            // Vẽ Cổng hoa ở cuối con đường
            const archW = endW * 2.2;
            drawRoseArch(width / 2, endY, archW, archW * 0.8);

            // Vẽ mặt đường
            const gradient = ctx.createLinearGradient(0, startY, 0, endY);
            gradient.addColorStop(0, '#3a1e32');
            gradient.addColorStop(1, '#15061c');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(width / 2 - startW / 2, startY);
            ctx.quadraticCurveTo(width / 2 - 40, (startY + endY) / 2, width / 2 - endW / 2, endY);
            ctx.lineTo(width / 2 + endW / 2, endY);
            ctx.quadraticCurveTo(width / 2 + 40, (startY + endY) / 2, width / 2 + startW / 2, startY);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#5c3a52';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(width / 2 - startW / 2, startY);
            ctx.quadraticCurveTo(width / 2 - 40, (startY + endY) / 2, width / 2 - endW / 2, endY);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(width / 2 + startW / 2, startY);
            ctx.quadraticCurveTo(width / 2 + 40, (startY + endY) / 2, width / 2 + endW / 2, endY);
            ctx.stroke();

            // Hàng hoa hồng dọc đường
            const numRoses = 10;
            for (let i = 0; i < numRoses; i++) {
                const t = i / numRoses;
                const pY = startY - (startY - endY) * t;
                const currentW = startW - (startW - endW) * t;
                const scale = (0.6 + (1 - t) * 0.5) * (1 + progress * 0.3);

                const leftX = (width / 2 - currentW / 2) - 30 * (1 - t * 0.5);
                drawCompleteRose(leftX, pY, scale);

                const rightX = (width / 2 + currentW / 2) + 30 * (1 - t * 0.5);
                drawCompleteRose(rightX, pY, scale);
            }

            ctx.restore();
        }

        // Vòng lặp Render
        function animate() {
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#07010a');
            bgGradient.addColorStop(0.5, '#1e0828');
            bgGradient.addColorStop(1, '#3b1238');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            fireflies.forEach(f => {
                f.y += (Math.random() - 0.5) * 0.6;
                f.x += (Math.random() - 0.5) * 0.6;
                if (f.y < 0) f.y = height;
                if (f.y > height) f.y = 0;

                ctx.fillStyle = `rgba(255, 220, 150, ${Math.abs(Math.sin(Date.now() * 0.003 + f.x))})`;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
                ctx.fill();
            });

            drawPath();

            butterflies.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;
                b.wingAngle += b.wingSpeed;

                if (b.x < 0 || b.x > width) b.vx *= -1;
                if (b.y < 0 || b.y > height * 0.7) b.vy *= -1;

                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.fillStyle = b.color;
                
                ctx.save();
                ctx.scale(Math.sin(b.wingAngle), 1);
                ctx.beginPath();
                ctx.arc(-b.size / 2, 0, b.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.scale(Math.sin(b.wingAngle), 1);
                ctx.beginPath();
                ctx.arc(b.size / 2, 0, b.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                ctx.restore();
            });

            birds.forEach(b => {
                b.x += b.vx;
                b.wing += 0.12;

                if (b.x > width + 100) b.x = -100;

                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.strokeStyle = '#f8bbd0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                const wingY = Math.sin(b.wing) * 9;
                ctx.moveTo(-b.size, wingY);
                ctx.quadraticCurveTo(-b.size / 2, -12, 0, 0);
                ctx.quadraticCurveTo(b.size / 2, -12, b.size, wingY);
                ctx.stroke();
                ctx.restore();
            });

            petals.forEach(p => {
                p.y += p.speedY;
                p.x += Math.sin(p.angle) + p.speedX;
                p.angle += p.spin;

                if (p.y > height) {
                    p.y = -10;
                    p.x = Math.random() * width;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = '#ff4081';
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            if (isMoving && progress < 1) {
                progress += 0.007;
                if (progress >= 1) {
                    progress = 1;
                    isMoving = false;
                    document.getElementById('wish-card').classList.add('active');
                }
            } else if (!isMoving && progress > 0 && progress < 1) {
                progress -= 0.01;
                if (progress <= 0) progress = 0;
            }

            requestAnimationFrame(animate);
        }

        function startJourney() {
            document.getElementById('hero-banner').classList.add('hidden');
            document.getElementById('start-btn').style.display = 'none';
            isMoving = true;
        }

        function restartJourney() {
            document.getElementById('wish-card').classList.remove('active');
            progress = 0.99;
            setTimeout(() => {
                isMoving = false;
                document.getElementById('hero-banner').classList.remove('hidden');
                document.getElementById('start-btn').style.display = 'block';
            }, 600);
        }

        animate();
    </script>
</body>
</html>
